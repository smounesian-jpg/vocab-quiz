<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه پیشرفته آزمون و مرور لایتنر</title>
    <link rel="manifest" href="/vocab-quiz/manifest.json">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
        }
        .dark-theme {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            text-align: center;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }
        .btn-option {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            font-size: 1rem;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn-option:active { transform: scale(0.98); }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }
        .explanation-box {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            text-align: right;
            display: none;
        }
        .dark-theme .explanation-box {
            background: #064e3b;
            color: #a7f3d0;
            border-color: #047857;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }
        .theme-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .import-section {
            margin-top: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="theme-btn" onclick="toggleTheme()">🌙</button>
        <h2>آزمون‌یار هوشمند لایتنر</h2>
        <div style="font-size: 1.2rem;">📊</div>
    </div>

    <div class="container">
        <div class="dashboard">
            <div class="stat-box">
                <div>کل سوالات بارگذاری شده</div>
                <strong id="total-count" style="font-size: 1.5rem; color: var(--primary);">0</strong>
            </div>
            <div class="stat-box">
                <div>امتیاز آزمون</div>
                <strong id="score-count" style="font-size: 1.5rem; color: var(--success);">0</strong>
            </div>
        </div>

        <div class="card" id="quiz-card">
            <h3 id="question-text">لطفاً ابتدا فایل JSON خود را از بخش زیر ایمپورت کنید.</h3>
            
            <div class="options-container" id="options-box" style="display: none;">
                <button class="btn-option" id="opt1" onclick="submitAnswer(1)"></button>
                <button class="btn-option" id="opt2" onclick="submitAnswer(2)"></button>
                <button class="btn-option" id="opt3" onclick="submitAnswer(3)"></button>
                <button class="btn-option" id="opt4" onclick="submitAnswer(4)"></button>
            </div>

            <div class="explanation-box" id="explanation-box"></div>
            <button class="btn-primary" id="next-btn" style="margin-top:1rem; display:none;" onclick="loadNextQuestion()">سوال بعدی ➔</button>
        </div>

        <div class="import-section">
            <h4>📥 ایمپورت دیتابیس آزمون یا لغات لایتنر</h4>
            <p style="font-size: 0.85rem; opacity: 0.8;">فایل `vocab_ALL_756.json` یا هر فایل تستی چهرگزینه‌ای دیگر را انتخاب کنید:</p>
            <input type="file" id="json-file-input" accept=".json" onchange="importJSONFile()" style="width: 100%;">
        </div>
    </div>

    <script src="/vocab-quiz/app.js"></script>
</body>
</html>
