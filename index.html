<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون‌یار و لایتنر پیشرفته کنکور</title>
    <link rel="manifest" href="/vocab-quiz/manifest.json">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
            --muted: #64748b;
        }
        .dark-theme {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border: #334155;
            --muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
            transition: all 0.3s ease;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }
        .container {
            max-width: 600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 12px;
            text-align: center;
            font-size: 0.9rem;
        }
        .stat-box strong {
            display: block;
            font-size: 1.25rem;
            margin-top: 0.25rem;
        }
        .filter-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            justify-content: space-between;
        }
        select, button.btn-mode {
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            cursor: pointer;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .meta-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .source-tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .dark-theme .source-tag {
            background: #312e81;
            color: #c7d2fe;
        }
        .id-tag {
            background: var(--bg-color);
            color: var(--text-color);
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }
        /* باکس سوال کاملاً انگلیسی و چپ‌چین با حمایت از شکستن درست خطوط */
        .question-text {
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
            white-space: normal;
            word-break: break-word;
            direction: ltr;
            text-align: left;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        /* گزینه‌ها کاملاً انگلیسی همراه با شماره گزینه انگلیسی برای عدم تداخل */
        .btn-option {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            direction: ltr;
            text-align: left;
            font-size: 1rem;
            line-height: 1.4;
            transition: background-color 0.2s;
        }
        .explanation-box {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            display: none;
            line-height: 1.6;
            direction: rtl;
            text-align: right;
        }
        .dark-theme .explanation-box {
            background: #064e3b;
            color: #a7f3d0;
            border-color: #047857;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            font-family: inherit;
        }
        .import-section {
            margin-top: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="btn-mode" id="leitner-toggle" onclick="toggleLeitnerMode()">📥 حالت: کل سوالات</button>
        <h2 style="font-size: 1.1rem; margin: 0;">آزمون‌یار هوشمند کنکور</h2>
        <button style="background:none; border:none; font-size:1.3rem; cursor:pointer;" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="container">
        <div class="dashboard">
            <div class="stat-box">
                <div>کل سوالات</div>
                <strong id="total-count" style="color: var(--primary);">0</strong>
            </div>
            <div class="stat-box">
                <div>لایتنر (غلط‌ها)</div>
                <strong id="leitner-count" style="color: var(--danger);">0</strong>
            </div>
            <div class="stat-box">
                <div>امتياز کل</div>
                <strong id="score-count" style="color: var(--success);">0</strong>
            </div>
        </div>

        <div class="filter-section" id="filter-bar">
            <label style="font-size: 0.85rem;">ترتیب نمایش آزمون:</label>
            <select id="order-select" onchange="changeOrderMode()">
                <option value="sequential">به ترتیب دفترچه</option>
                <option value="random">تصادفی (Random)</option>
            </select>
        </div>

        <div class="card" id="quiz-card">
            <div class="meta-container">
                <span id="source-wrapper"></span>
                <span id="id-wrapper"></span>
            </div>
            
            <div class="question-text" id="question-text">لطفاً ابتدا فایل JSON خود را از بخش زیر ایمپورت کنید.</div>
            
            <div class="options-container" id="options-box" style="display: none;">
                <button class="btn-option" id="opt1" onclick="submitAnswer(1)"></button>
                <button class="btn-option" id="opt2" onclick="submitAnswer(2)"></button>
                <button class="btn-option" id="opt3" onclick="submitAnswer(3)"></button>
                <button class="btn-option" id="opt4" onclick="submitAnswer(4)"></button>
            </div>

            <div class="explanation-box" id="explanation-box"></div>
            <button class="btn-primary" id="next-btn" style="margin-top:1rem; display:none;" onclick="loadNextQuestion()">سوال بعدی ➔</button>
        </div>

        <div class="import-section">
            <h4 style="margin: 0 0 0.5rem 0; font-size: 0.95rem;">📥 بارگذاری دیتابیس تست کنکور (`vocab_ALL_756.json`)</h4>
            <input type="file" id="json-file-input" accept=".json" onchange="importJSONFile()" style="width: 100%;">
        </div>
    </div>

    <script src="/vocab-quiz/app.js"></script>
</body>
</html>
